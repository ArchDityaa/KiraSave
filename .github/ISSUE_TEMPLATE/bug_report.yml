name: Bug report
description: Laporkan bug atau crash pada KiraSave
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melaporkan. **Jangan mencantumkan data pribadi, tautan privat, atau kredensial.**
        Untuk kerentanan keamanan, gunakan tab Security, bukan Issue publik.

  - type: input
    id: version
    attributes:
      label: Versi KiraSave
      description: Terlihat di Setelan → Tentang.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Perangkat dan Android
      placeholder: "Samsung A52, Android 14"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area masalah
      options:
        - Analisis link
        - Unduhan video
        - Carousel foto
        - Audio atau M4A
        - Batch
        - Stories
        - Koleksi atau penyimpanan
        - Pemutar video
        - Tampilan atau navigasi
        - Lainnya
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka Beranda
        2. Tempel link ...
        3. Tekan Analisis
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Hasil sebenarnya
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log atau screenshot
      description: Seret gambar ke sini bila perlu. Hapus data pribadi terlebih dahulu.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Konfirmasi
      options:
        - label: Saya memakai versi terbaru dari Releases.
          required: true
        - label: Saya sudah mencari Issue serupa.
          required: true
        - label: Laporan ini tidak berisi data pribadi atau konten privat.
          required: true
