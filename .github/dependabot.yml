version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - androidx.*
      kotlin-and-compose:
        patterns:
          - org.jetbrains.kotlin*
          - androidx.compose.*
      testing:
        patterns:
          - org.robolectric*
          - io.github.takahirom.roborazzi*
          - androidx.test.*
    ignore:
      # Compose BOM 2026.x requires AGP 9 / compileSdk 37.
      - dependency-name: androidx.compose:compose-bom
        versions:
          - ">= 2026.0.0"
      # Media3 1.11.x pulls Compose BOM 2026.05.
      - dependency-name: androidx.media3:*
        versions:
          - ">= 1.11.0"
      # Keep the verified AGP 8.13 / compileSdk 36 toolchain.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
      - dependency-name: com.google.devtools.ksp
        versions:
          - ">= 2.3.0"
      - dependency-name: org.jetbrains.kotlin*
        versions:
          - ">= 2.3.0"
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: com.squareup.okhttp3:okhttp
        update-types:
          - version-update:semver-major
      # AndroidX 1.17+ minors require AGP 9 / compileSdk 37.
      - dependency-name: androidx.*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
